name: macOS Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest main build should publish the easy-download test release.
concurrency:
  group: simai-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.event.before == '34e4c8215accdc102e4a68b15945284df2b9259a' && github.event.head_commit.message == 'Fix release variable expansion and recover verified packages') }}
    name: Build Apple Silicon App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read package versions
        shell: bash
        run: |
          set -euo pipefail
          mac="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          android="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' AndroidCompanion/app/build.gradle.kts)"
          [[ "$mac" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$android" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'MAC_VERSION=%s\nANDROID_VERSION=%s\nMAC_PACKAGE=SIM-AI-Assistant-v%s-macos-arm64.zip\nANDROID_PACKAGE=SIMAI-Companion-v%s-debug.apk\n' "$mac" "$android" "$mac" "$android" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Setup Java 17 for Android Companion
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure existing macOS runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER" || { echo "Android sdkmanager not found at $MANAGER"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android Companion test APK
        env:
          SIMAI_ANDROID_KEYSTORE_B64: ${{ secrets.SIMAI_ANDROID_KEYSTORE_B64 }}
          SIMAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIMAI_ANDROID_KEYSTORE_PASSWORD }}
          SIMAI_ANDROID_KEY_ALIAS: ${{ secrets.SIMAI_ANDROID_KEY_ALIAS }}
          SIMAI_ANDROID_KEY_PASSWORD: ${{ secrets.SIMAI_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          signing_fields=0
          for field in "$SIMAI_ANDROID_KEYSTORE_B64" "$SIMAI_ANDROID_KEYSTORE_PASSWORD" "$SIMAI_ANDROID_KEY_ALIAS" "$SIMAI_ANDROID_KEY_PASSWORD"; do
            if [[ -n "$field" ]]; then signing_fields=$((signing_fields + 1)); fi
          done
          if [[ "$signing_fields" == 4 ]]; then
            KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/simai-android-XXXXXXXX")"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            chmod 600 "$KEYSTORE_PATH"
            printf '%s' "$SIMAI_ANDROID_KEYSTORE_B64" | base64 -D > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            export SIMAI_ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
            printf 'STABLE_SECRET_SIGNING\n' > dist/SIMAI-Android-Signing.txt
            echo "Android debug APK signed with private GitHub Secrets keystore."
          elif [[ "$signing_fields" == 0 ]]; then
            printf 'EPHEMERAL_DEBUG_SIGNING\n' > dist/SIMAI-Android-Signing.txt
            echo "::warning::Fixed signing secrets are absent. Runner debug APK may not upgrade the current phone app without a signing migration."
          else
            echo "::error::Only some of the four signing secrets are set. Refusing to build an ambiguously signed APK."
            exit 1
          fi
          gradle -p AndroidCompanion :app:assembleDebug --no-daemon
          cp AndroidCompanion/app/build/outputs/apk/debug/app-debug.apk dist/$ANDROID_PACKAGE
          test -s dist/$ANDROID_PACKAGE
          shasum -a 256 dist/$ANDROID_PACKAGE > dist/$ANDROID_PACKAGE.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/$ANDROID_PACKAGE


      - name: Build Android 13 audio capability helper
        run: bash Scripts/build-audio-probe.sh

      - name: Run tests and build arm64 app
        env:
          TARGET_TRIPLE: arm64-apple-macosx13.0
          ANDROID_COMPANION_APK_PATH: ${{ github.workspace }}/dist/${{ env.ANDROID_PACKAGE }}
          ANDROID_AUDIO_PROBE_JAR_PATH: ${{ github.workspace }}/dist/SIMAI-Audio-Probe.jar
          ANDROID_COMPANION_SIGNING_STATUS_PATH: ${{ github.workspace }}/dist/SIMAI-Android-Signing.txt
        run: bash Scripts/build-macos.sh

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-Assistant-macOS-arm64
          path: |
            dist/${{ env.MAC_PACKAGE }}
            dist/${{ env.MAC_PACKAGE }}.sha256
            dist/SIMAI-Audio-Probe.jar
            dist/SIMAI-Android-Signing.txt
            dist/${{ env.ANDROID_PACKAGE }}
            dist/${{ env.ANDROID_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish rolling latest release and prune old assets
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash Scripts/prune-dev-latest.sh

  recover-release:
    name: Recover already built packages (maintenance only)
    if: ${{ github.event_name == 'push' && github.event.before == '34e4c8215accdc102e4a68b15945284df2b9259a' && github.event.head_commit.message == 'Fix release variable expansion and recover verified packages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate maintenance-only changes and recover verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=34e4c8215accdc102e4a68b15945284df2b9259a
          run=46164687989
          [[ "$(git rev-parse HEAD^)" == "$previous" ]]
          while IFS= read -r file; do
            case "$file" in .github/workflows/build-macos.yml|Scripts/prune-dev-latest.sh) ;; *) echo "Unexpected change: $file"; exit 1;; esac
          done < <(git diff --name-only "$previous" HEAD)
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" == "$previous" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].steps[] | select(.name == "Run tests and build arm64 app" or .name == "Upload downloadable macOS app") | .conclusion' | diff - <(printf 'success\nsuccess\n')
          mac="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          android="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' AndroidCompanion/app/build.gradle.kts)"
          [[ "$mac" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$android" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export MAC_VERSION="$mac" ANDROID_VERSION="$android" MAC_PACKAGE="SIM-AI-Assistant-v$mac-macos-arm64.zip" ANDROID_PACKAGE="SIMAI-Companion-v$android-debug.apk"
          gh run download "$run" --name SIM-AI-Assistant-macOS-arm64 --dir dist
          for name in "$MAC_PACKAGE" "$ANDROID_PACKAGE"; do
            expected="$(awk 'NR==1 {print $1}' "dist/$name.sha256")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(sha256sum "dist/$name" | awk '{print $1}')" == "$expected" ]]
          done
          bash -n Scripts/prune-dev-latest.sh
          bash Scripts/prune-dev-latest.sh

  prune-branches:
    name: Clean merged and retired branches
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove merged and retired development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash Scripts/prune-branches.sh
