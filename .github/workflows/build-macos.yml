name: macOS Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import initial source (one-time bootstrap)
        if: ${{ github.ref == 'refs/heads/main' && hashFiles('bootstrap/source.tar.xz.base64') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import lzma
          import pathlib
          import tarfile
          source = pathlib.Path("bootstrap/source.tar.xz.base64")
          raw = lzma.decompress(base64.b64decode(source.read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              entries = archive.getmembers()
              for entry in entries:
                  p = pathlib.PurePosixPath(entry.name)
                  if p.is_absolute() or ".." in p.parts or entry.issym() or entry.islnk():
                      raise RuntimeError("Unsafe archive path")
              archive.extractall(".", members=entries)
          source.unlink()
          source.parent.rmdir()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import SIM AI Assistant V0.1 sources"
          git push origin HEAD:main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Run tests and build arm64 app
        env:
          TARGET_TRIPLE: arm64-apple-macosx13.0
        run: bash Scripts/build-macos.sh

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-Assistant-macOS-arm64
          path: |
            dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip
            dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Update easy-download prerelease
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --target "$(git rev-parse HEAD)" \
              --title "SIM AI Assistant · 最新测试版" --prerelease \
              --notes "Apple Silicon arm64 测试包；未经 Apple Developer ID 签名与公证。当前 V0.1 不支持真实运营商电话自动接听。"
          fi
          gh release upload dev-latest dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip.sha256 --clobber

      - name: Publish versioned prerelease on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip \
            dist/SIM-AI-Assistant-v0.1.0-macos-arm64.zip.sha256 \
            --title "SIM AI Assistant $GITHUB_REF_NAME" --prerelease \
            --notes "macOS Apple Silicon arm64 测试版，未公证；请查看 README 和校验 SHA256。"
