name: macOS Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Setup Java 17 for Android Companion
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure existing macOS runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER" || { echo "Android sdkmanager not found at $MANAGER"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android Companion test APK
        run: |
          gradle -p AndroidCompanion :app:assembleDebug --no-daemon
          mkdir -p dist
          cp AndroidCompanion/app/build/outputs/apk/debug/app-debug.apk dist/SIMAI-Companion-v0.2.2-debug.apk
          test -s dist/SIMAI-Companion-v0.2.2-debug.apk
          shasum -a 256 dist/SIMAI-Companion-v0.2.2-debug.apk > dist/SIMAI-Companion-v0.2.2-debug.apk.sha256


      - name: Build Android 13 audio capability helper
        run: bash Scripts/build-audio-probe.sh

      - name: Run tests and build arm64 app
        env:
          TARGET_TRIPLE: arm64-apple-macosx13.0
          ANDROID_COMPANION_APK_PATH: ${{ github.workspace }}/dist/SIMAI-Companion-v0.2.2-debug.apk
          ANDROID_AUDIO_PROBE_JAR_PATH: ${{ github.workspace }}/dist/SIMAI-Audio-Probe.jar
        run: bash Scripts/build-macos.sh

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-Assistant-macOS-arm64
          path: |
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip.sha256
            dist/SIMAI-Audio-Probe.jar
            dist/SIMAI-Companion-v0.2.2-debug.apk
            dist/SIMAI-Companion-v0.2.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Update easy-download prerelease
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --target "$(git rev-parse HEAD)" \
              --title "SIM AI Assistant · 最新测试版" --prerelease \
              --notes "Apple Silicon arm64 测试包；未经 Apple Developer ID 签名与公证。V0.3.2 修复 ADB 转发早于 Android 音频服务监听而导致的无握手响应；增加限时重试、Helper 退出诊断和握手次数统计。"
          fi
          gh release upload dev-latest \
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip \
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip.sha256 \
            dist/SIMAI-Audio-Probe.jar \
            dist/SIMAI-Companion-v0.2.2-debug.apk \
            dist/SIMAI-Companion-v0.2.2-debug.apk.sha256 --clobber

      - name: Publish versioned prerelease on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip \
            dist/SIM-AI-Assistant-v0.3.2-macos-arm64.zip.sha256 \
            dist/SIMAI-Companion-v0.2.2-debug.apk \
            dist/SIMAI-Companion-v0.2.2-debug.apk.sha256 \
            dist/SIMAI-Audio-Probe.jar \
            --title "SIM AI Assistant $GITHUB_REF_NAME" --prerelease \
            --notes "macOS Apple Silicon arm64 测试版，未公证；请查看 README 和校验 SHA256。"
