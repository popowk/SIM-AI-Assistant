name: macOS Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Only the newest main build should publish the easy-download test release.
concurrency:
  group: simai-microphone-v0412-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Setup Java 17 for Android Companion
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure existing macOS runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER" || { echo "Android sdkmanager not found at $MANAGER"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android Companion test APK
        env:
          SIMAI_ANDROID_KEYSTORE_B64: ${{ secrets.SIMAI_ANDROID_KEYSTORE_B64 }}
          SIMAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIMAI_ANDROID_KEYSTORE_PASSWORD }}
          SIMAI_ANDROID_KEY_ALIAS: ${{ secrets.SIMAI_ANDROID_KEY_ALIAS }}
          SIMAI_ANDROID_KEY_PASSWORD: ${{ secrets.SIMAI_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          signing_fields=0
          for field in "$SIMAI_ANDROID_KEYSTORE_B64" "$SIMAI_ANDROID_KEYSTORE_PASSWORD" "$SIMAI_ANDROID_KEY_ALIAS" "$SIMAI_ANDROID_KEY_PASSWORD"; do
            if [[ -n "$field" ]]; then signing_fields=$((signing_fields + 1)); fi
          done
          if [[ "$signing_fields" == 4 ]]; then
            KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/simai-android-XXXXXXXX")"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            chmod 600 "$KEYSTORE_PATH"
            printf '%s' "$SIMAI_ANDROID_KEYSTORE_B64" | base64 -D > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            export SIMAI_ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
            printf 'STABLE_SECRET_SIGNING\n' > dist/SIMAI-Android-Signing.txt
            echo "Android debug APK signed with private GitHub Secrets keystore."
          elif [[ "$signing_fields" == 0 ]]; then
            printf 'EPHEMERAL_DEBUG_SIGNING\n' > dist/SIMAI-Android-Signing.txt
            echo "::warning::Fixed signing secrets are absent. Runner debug APK may not upgrade the current phone app without a signing migration."
          else
            echo "::error::Only some of the four signing secrets are set. Refusing to build an ambiguously signed APK."
            exit 1
          fi
          gradle -p AndroidCompanion :app:assembleDebug --no-daemon
          cp AndroidCompanion/app/build/outputs/apk/debug/app-debug.apk dist/SIMAI-Companion-v0.3.5-debug.apk
          test -s dist/SIMAI-Companion-v0.3.5-debug.apk
          shasum -a 256 dist/SIMAI-Companion-v0.3.5-debug.apk > dist/SIMAI-Companion-v0.3.5-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/SIMAI-Companion-v0.3.5-debug.apk


      - name: Build Android 13 audio capability helper
        run: bash Scripts/build-audio-probe.sh

      - name: Run tests and build arm64 app
        env:
          TARGET_TRIPLE: arm64-apple-macosx13.0
          ANDROID_COMPANION_APK_PATH: ${{ github.workspace }}/dist/SIMAI-Companion-v0.3.5-debug.apk
          ANDROID_AUDIO_PROBE_JAR_PATH: ${{ github.workspace }}/dist/SIMAI-Audio-Probe.jar
          ANDROID_COMPANION_SIGNING_STATUS_PATH: ${{ github.workspace }}/dist/SIMAI-Android-Signing.txt
        run: bash Scripts/build-macos.sh

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-Assistant-macOS-arm64
          path: |
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip.sha256
            dist/SIMAI-Audio-Probe.jar
            dist/SIMAI-Android-Signing.txt
            dist/SIMAI-Companion-v0.3.5-debug.apk
            dist/SIMAI-Companion-v0.3.5-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Update easy-download prerelease
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Older commits may finish out of order; never overwrite the latest
          # downloadable assets with a stale build.
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale dev-latest upload for $GITHUB_SHA (main=$MAIN_SHA)"
            exit 0
          fi
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --target "$(git rev-parse HEAD)" \
              --title "SIM AI Assistant · 最新测试版" --prerelease \
              --notes "Apple Silicon arm64 测试包；未经 Apple Developer ID 签名与公证。V0.4.13 根据真实诊断音频丢帧，物理耳机与 BlackHole 2ch 改用持续音频渲染环形缓冲，记录实际渲染帧数；不改变 Android APK 或精简界面。"
          fi
          gh release upload dev-latest \
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip \
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip.sha256 \
            dist/SIMAI-Audio-Probe.jar \
            dist/SIMAI-Android-Signing.txt \
            dist/SIMAI-Companion-v0.3.5-debug.apk \
            dist/SIMAI-Companion-v0.3.5-debug.apk.sha256 --clobber

      - name: Publish versioned prerelease on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip \
            dist/SIM-AI-Assistant-v0.4.13-macos-arm64.zip.sha256 \
            dist/SIMAI-Companion-v0.3.5-debug.apk \
            dist/SIMAI-Companion-v0.3.5-debug.apk.sha256 \
            dist/SIMAI-Android-Signing.txt \
            dist/SIMAI-Audio-Probe.jar \
            --title "SIM AI Assistant $GITHUB_REF_NAME" --prerelease \
            --notes "macOS Apple Silicon arm64 测试版，未公证；请查看 README 和校验 SHA256。"
